services:
  postgres:
    image: postgres:16-alpine
    container_name: profibux-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: profibux
      POSTGRES_PASSWORD: profibux
      POSTGRES_DB: profibux
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profibux"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: profibux-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Локальная замена S3 для доказательств. Бакет приватный:
  # доступ только по presigned-ссылкам с коротким сроком жизни.
  minio:
    image: minio/minio:latest
    container_name: profibux-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: profibux
      MINIO_ROOT_PASSWORD: profibux123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 profibux profibux123 &&
      mc mb --ignore-existing local/profibux-proofs &&
      mc anonymous set none local/profibux-proofs &&
      echo 'Бакет profibux-proofs готов (приватный)'
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
